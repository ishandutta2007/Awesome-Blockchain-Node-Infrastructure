3" letter-spacing="2">⚡ BLOCKCHAIN INFRASTRUCTURE</text></g><text x="0" y="30" fill="#fff" class="title-text" filter="url(#glow)" font-size="44" letter-spacing=".5" transform="translate(600, 150)">Awesome Blockchain Node Infrastructure</text><text x="0" y="80" fill="#a0aec0" class="subtitle-text" font-size="18" letter-spacing=".5" transform="translate(600, 150)">Top SaaS RPC Gateways • High-Throughput Node Clients • Multi-Chain Enterprise Web3</text><g><g transform="translate(600, 150) translate(0, 130) translate(-240, 0)"><rect width="140" height="30" x="-70" y="-15" fill="#121929" stroke="#3b82f6" stroke-width="1" rx="15"/><text x="0" y="5" fill="#93c5fd" class="subtitle-text" font-size="12">🔷 Ethereum &amp; L2s</text></g><g transform="translate(600, 150) translate(0, 130) translate(-80, 0)"><rect width="130" height="30" x="-65" y="-15" fill="#121929" stroke="#14b8a6" stroke-width="1" rx="15"/><text x="0" y="5" fill="#5eead4" class="subtitle-text" font-size="12">⚡ Solana RPC</text></g><g transform="translate(600, 150) translate(0, 130) translate(70, 0)"><rect width="130" height="30" x="-65" y="-15" fill="#121929" stroke="#f59e0b" stroke-width="1" rx="15"/><text x="0" y="5" fill="#fcd34d" class="subtitle-text" font-size="12">₿ Bitcoin Core</text></g><g transform="translate(600, 150) translate(0, 130) translate(230, 0)"><rect width="150" height="30" x="-75" y="-15" fill="#121929" stroke="#a855f7" stroke-width="1" rx="15"/><text x="0" y="5" fill="#c084fc" class="subtitle-text" font-size="12">🌐 DePIN &amp; Multi-Chain</text></g></g></g></svg>