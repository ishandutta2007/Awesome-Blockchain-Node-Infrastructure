<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 400"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0a0f1d"/><stop offset="50%" stop-color="#070a14"/><stop offset="100%" stop-color="#0d1527"/></linearGradient><linearGradient id="cyanPurple" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#00f2fe"/><stop offset="100%" stop-color="#4facfe"/></linearGradient><linearGradient id="emeraldGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#00f5d4"/><stop offset="100%" stop-color="#7b2cbf"/></linearGradient><radialGradient id="glowPulse" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#00f2fe" stop-opacity=".35"/><stop offset="100%" stop-color="#000" stop-opacity="0"/></radialGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="12"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><filter id="softGlow"><feGaussianBlur result="blur" stdDeviation="6"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><style>@keyframes floatParticle{0%{transform:translateY(0) scale(1);opacity:.4}50%{transform:translateY(-15px) scale(1.15);opacity:.85}}@keyframes pulseGlow{0%{opacity:.3;transform:scale(1)}50%{opacity:.7;transform:scale(1.08)}}@keyframes badgePulse{0%{transform:scale(1)}50%{transform:scale(1.03)}}.particle{animation:floatParticle 6s ease-in-out infinite}.particle-delay1{animation:floatParticle 8s ease-in-out infinite 2s}.particle-delay2{animation:floatParticle 7s ease-in-out infinite 4s}.glowing-bg{animation:pulseGlow 9s ease-in-out infinite;transform-origin:center}.network-line{stroke-dasharray:8 12;animation:dashMove 4s linear infinite}.subtitle-text,.title-text{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.title-text{font-weight:800}.subtitle-text{font-weight:500}</style></defs><rect widt