<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#070a14"/>
      <stop offset="100%" stop-color="#0d1527"/>
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>

    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5d4"/>
      <stop offset="100%" stop-color="#7b2cbf"/>
    </linearGradient>

    <radialGradient id="glowPulse" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Filters for Glow Effects -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="softGlow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Animations -->
    <style>
      @keyframes floatParticle {
        0% { transform: translateY(0px) scale(1); opacity: 0.4; }
        50% { transform: translateY(-15px) scale(1.15); opacity: 0.85; }
        100% { transform: translateY(0px) scale(1); opacity: 0.4; }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.3; transform: scale(1); }
        50% { opacity: 0.7; transform: scale(1.08); }
      }
      @keyframes dashMove {
        to { stroke-dashoffset: -80; }
      }
      @keyframes badgePulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.03); }
      }

      .particle { animation: floatParticle 6s ease-in-out infinite; }
      .particle-delay1 { animation: floatParticle 8s ease-in-out infinite 2s; }
      .particle-delay2 { animation: floatParticle 7s ease-in-out infinite 4s; }
      .glowing-bg { animation: pulseGlow 9s ease-in-out infinite; transform-origin: center; }
      .network-line { stroke-dasharray: 8 12; animation: dashMove 4s linear infinite; }
      .title-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; }
      .subtitle-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="400" fill="url(#bgGrad)" rx="16"/>

  <!-- Dynamic Glowing Orbs (Background Layer) -->
  <circle cx="200" cy="100" r="180" fill="url(#glowPulse)" class="glowing-bg"/>
  <circle cx="1000" cy="300" r="220" fill="url(#glowPulse)" class="glowing-bg" style="animation-delay: 3s;"/>

  <!-- Background Network Nodes & Mesh Lines (Background Layer - Behind Text) -->
  <g opacity="0.25">
    <line x1="100" y1="80" x2="300" y2="150" stroke="#00f2fe" stroke-width="1.5" class="network-line"/>
    <line x1="300" y1="150" x2="550" y2="90" stroke="#4facfe" stroke-width="1.5" class="network-line"/>
    <line x1="550" y1="90" x2="850" y2="160" stroke="#7b2cbf" stroke-width="1.5" class="network-line"/>
    <line x1="850" y1="160" x2="1100" y2="100" stroke="#00f5d4" stroke-width="1.5" class="network-line"/>

    <line x1="150" y1="320" x2="400" y2="280" stroke="#00f2fe" stroke-width="1.5" class="network-line"/>
    <line x1="400" y1="280" x2="700" y2="340" stroke="#7b2cbf" stroke-width="1.5" class="network-line"/>
    <line x1="700" y1="340" x2="1050" y2="290" stroke="#00f5d4" stroke-width="1.5" class="network-line"/>
  </g>

  <!-- Animated Floating Node Particles (Background Layer) -->
  <g opacity="0.6">
    <circle cx="100" cy="80" r="4" fill="#00f2fe" class="particle"/>
    <circle cx="300" cy="150" r="6" fill="#00f5d4" class="particle-delay1"/>
    <circle cx="550" cy="90" r="5" fill="#4facfe" class="particle-delay2"/>
    <circle cx="850" cy="160" r="7" fill="#7b2cbf" class="particle"/>
    <circle cx="1100" cy="100" r="5" fill="#00f2fe" class="particle-delay1"/>

    <circle cx="150" cy="320" r="5" fill="#00f5d4" class="particle-delay2"/>
    <circle cx="400" cy="280" r="6" fill="#00f2fe" class="particle"/>
    <circle cx="700" cy="340" r="5" fill="#4facfe" class="particle-delay1"/>
    <circle cx="1050" cy="290" r="7" fill="#7b2cbf" class="particle-delay2"/>
  </g>

  <!-- Decorative Border & Glass Header Box -->
  <rect x="20" y="20" width="1160" height="360" rx="12" fill="none" stroke="url(#cyanPurple)" stroke-width="1.5" opacity="0.4"/>

  <!-- Foreground Content (Title, Badges & Subtitle) -->
  <g transform="translate(600, 150)" text-anchor="middle">
    <!-- Category Pill Badge -->
    <g transform="translate(0, -50)">
      <rect x="-140" y="-18" width="280" height="36" rx="18" fill="#141c2e" stroke="#00f2fe" stroke-width="1.5" filter="url(#softGlow)"/>
      <text x="0" y="5" fill="#00f2fe" font-size="13" class="subtitle-text" letter-spacing="2">⚡ BLOCKCHAIN INFRASTRUCTURE</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="30" fill="#ffffff" font-size="44" class="title-text" filter="url(#glow)" letter-spacing="0.5">
      Awesome Blockchain Node Infrastructure
    </text>

    <!-- Subtitle -->
    <text x="0" y="80" fill="#a0aec0" font-size="18" class="subtitle-text" letter-spacing="0.5">
      Top SaaS RPC Gateways • High-Throughput Node Clients • Multi-Chain Enterprise Web3
    </text>

    <!-- Feature Pills Bar -->
    <g transform="translate(0, 130)">
      <!-- Pill 1: Ethereum -->
      <g transform="translate(-240, 0)">
        <rect x="-70" y="-15" width="140" height="30" rx="15" fill="#121929" stroke="#3b82f6" stroke-width="1"/>
        <text x="0" y="5" fill="#93c5fd" font-size="12" class="subtitle-text">🔷 Ethereum &amp; L2s</text>
      </g>
      <!-- Pill 2: Solana -->
      <g transform="translate(-80, 0)">
        <rect x="-65" y="-15" width="130" height="30" rx="15" fill="#121929" stroke="#14b8a6" stroke-width="1"/>
        <text x="0" y="5" fill="#5eead4" font-size="12" class="subtitle-text">⚡ Solana RPC</text>
      </g>
      <!-- Pill 3: Bitcoin -->
      <g transform="translate(70, 0)">
        <rect x="-65" y="-15" width="130" height="30" rx="15" fill="#121929" stroke="#f59e0b" stroke-width="1"/>
        <text x="0" y="5" fill="#fcd34d" font-size="12" class="subtitle-text">₿ Bitcoin Core</text>
      </g>
      <!-- Pill 4: DePIN & Multi-Chain -->
      <g transform="translate(230, 0)">
        <rect x="-75" y="-15" width="150" height="30" rx="15" fill="#121929" stroke="#a855f7" stroke-width="1"/>
        <text x="0" y="5" fill="#c084fc" font-size="12" class="subtitle-text">🌐 DePIN &amp; Multi-Chain</text>
      </g>
    </g>
  </g>
</svg>
